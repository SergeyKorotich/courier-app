<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Курьер — смены</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6fed">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Курьер">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Ваш CSS здесь */
</style>
</head>
<body>
<div id="msg"></div>

<!-- ВХОД / РЕГИСТРАЦИЯ -->
<div id="loginScreen" style="display:none">
<!-- ... -->
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="menuScreen" style="display:none">
<!-- ... -->
</div>

<!-- ПУТЕВЫЕ ЛИСТЫ -->
<div id="plScreen" style="display:none">
<div class="card">
<h2>🧾 Путевые листы</h2>
<label>Период</label>
<select id="plPeriod" onchange="plRenderList()">
<option value="day">День</option>
<option value="week">Неделя</option>
<option value="month">Месяц</option>
</select>
<label>Дата (любая внутри периода)</label>
<input id="plDate" type="date" onchange="plRenderList()">
<button onclick="plDownloadMerged()">Скачать объединённые путевые листы</button>
</div>
</div>

<script>
function plDownloadMerged() {
const params = {
action: 'downloadMerged',
dates: $('#plDate').val(),
};
fetch('/path/to/api', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(params)
})
.then(response => response.blob())
.then(blob => {
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = 'merged-pl.pdf';
a.click();
});
}
</script>
</body>
</html>
